#Multiple Servers & Hostnames

# Server 1: Standard on 8082
server {
    listen 8082;
    host 127.0.0.1;
    server_name server_one;
    root ./www;
    index index.html;
    client_max_body_size 1000000;

    location / {
        allow_methods GET;
        autoindex on;
    }
}

# Server 2: Standard on 8083
server {
    listen 8083;
    host 127.0.0.1;
    server_name server_two;
    root ./www;
    index index.html;
    client_max_body_size 1000000;

    location / {
        allow_methods GET;
        autoindex on;
    }
}

# Server 3: Host collision on 8084
server {
    listen 8084;
    host 127.0.0.1;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 1000000;

    location / {
        allow_methods GET;
        autoindex on;
    }
}

# Server 4: Host collision on 8084
# Requesting 'Host: example.com' should reach here (if supported)
# curl -H "Host: example.com" localhost:8084
server {
    listen 8084;
    host 127.0.0.1;
    server_name example.com;
    root ./www;
    index index.html;
    client_max_body_size 1000000;

    location / {
        allow_methods GET;
        autoindex off;
    }
}
